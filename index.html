.bl{background:linear-gradient(135deg,#00a651,#0bd16a)}.gr{background:linear-gradient(135deg,#00b8a9,#12d6c3)}.ye{background:linear-gradient(135deg,#ff9f1c,#ffc233)}.pu{background:linear-gradient(135deg,#4caf00,#8fd14f)}.re{background:linear-gradient(135deg,#046c36,#0b8f5e)}
button.op,button.pri,.chip{font:inherit;border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:12px;padding:10px 12px;margin:5px 0;width:100%;text-align:left;cursor:pointer}

.bar{height:14px;background:var(--l);border-radius:8px;overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--g)}

.foot{display:flex;justify-content:space-between;margin-top:20px}

.badge{display:inline-block;background:var(--y);color:#000;border-radius:20px;padding:4px 12px;font-weight:800;font-size:.85rem}
header{position:relative;overflow:hidden;padding-bottom:34px}header>*:not(.fl){position:relative;z-index:1}header>svg.w{position:absolute;bottom:0;left:0;width:100%;height:30px;opacity:.5}
.esc{width:78px;height:116px;margin:0 auto 8px;cursor:pointer;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 4px 6px #0005)}.esc img{width:100%;height:100%;object-fit:contain}.esc svg{width:100%;height:100%}
.fl{position:absolute;font-size:1.7rem;opacity:.55;animation:float 4s ease-in-out infinite;z-index:0}
@keyframes float{50%{transform:translateY(-9px) rotate(4deg)}}@keyframes up{from{opacity:0;transform:translateY(20px)}}@keyframes pop{50%{transform:scale(1.04)}}@keyframes bnc{50%{transform:scale(1.25) rotate(-8deg)}}
main>*{animation:up .5s both}main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}
.card,.flip{transition:transform .2s,box-shadow .2s}.card:hover,.flip:hover{transform:translateY(-3px);box-shadow:0 10px 22px #00a65130}
button.op{transition:all .15s}button.op:hover{transform:translateX(5px);border-color:var(--b)}button.op.g{animation:pop .4s}
nav button{transition:transform .15s}nav button:hover{transform:scale(1.08)}nav button.on{background:linear-gradient(135deg,#00a651,#7ed957)}
h2{color:var(--b);font-size:1.5rem}h3{border-left:5px solid var(--y);padding-left:10px}
.pbar{height:6px;background:var(--l)}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00a651,#ffd23f);transition:width .6s}
.ban{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#00a651,#7ed957);color:#fff;border-radius:20px;padding:8px 18px;font-weight:800;font-size:2.1rem;box-shadow:0 4px 12px #00a65140}.ban span{font-size:1rem;letter-spacing:.05em}.ban b{display:inline-block;animation:bnc 2.2s infinite}

const SK=[["Liderazgo","Influir positivamente en otros hacia metas comunes, dando ejemplo y asumiendo responsabilidad."],["Comunicación","Transmitir y recibir mensajes con claridad, asertividad y empatía. Modelo: Hecho → Impacto → Propuesta."],["Trabajo en equipo","Colaborar, compartir responsabilidades y valorar los aportes de todos."],["Inteligencia emocional","Reconocer y regular las propias emociones y comprender las ajenas. Pausa → Nombra → Elige."],["Resolución de problemas","Analizar, generar alternativas, decidir y evaluar resultados."]];

const CASES={
c1:{t:"Caso 1 · Conflicto en el equipo (Entrenador)",ctx:"Eres entrenador asistente de un equipo sub-17. Mateo, nuevo y callado, falla un pase y Daniel, el capitán, dice en voz alta «Con este no se puede jugar». Varios ríen y Mateo se aparta. El entrenador principal no está. ¿Qué haces?",o:[["Detengo todo y reprendo a Daniel frente al grupo.","Parcial: marcas límites, pero la exposición pública humilla a Daniel y genera resistencia.","a"],["Hago una pausa, me acerco a Mateo y luego hablo con Daniel en privado.","Más adecuada: cuidas al afectado y preparas un diálogo. Integras respeto, comunicación e inteligencia emocional.","b"],["Finjo que no pasó nada.","No recomendable: normalizas la burla y debilitas tu liderazgo.","c"]],n:{
a:{ctx:"Daniel calla, pero se va enojado y evita a Mateo, que se siente más expuesto. ¿Y ahora?",o:[["Dejo pasar el tema: ya puse orden.","No: el conflicto sigue latente.",0],["Hablo con Daniel en privado, reconozco que mi intervención fue pública y propongo conversar.","Sí: reparas el efecto de tu decisión y modelas la autocrítica.",1],["Los obligo a darse la mano ante todos.","No: gesto forzado, no resuelve la causa.",0]]},
b:{ctx:"Mateo teme perder su espacio; Daniel admite sentirse amenazado. Ambos aceptan hablar contigo. ¿Cómo estructuras la conversación?",o:[["Cada uno expone su punto sin interrupciones y buscamos acuerdos sobre roles.","Sí: escucha activa, empatía y construcción de acuerdos.",1],["Decido yo quién tiene razón.","No: eliminas su participación.",0],["Pido al grupo que opine sobre quién tiene la culpa.","No: expones y polarizas.",0]]},
c:{ctx:"Dos días después las burlas continúan y el entrenador principal pregunta qué pasó.",o:[["Digo que no pasó nada relevante.","No: ocultas el problema.",0],["Informo con honestidad, reconozco que no actué a tiempo y propongo un plan.","Sí: liderazgo y excelencia profesional: asumir y corregir.",1],["Culpo a Daniel de todo.","No: desplazas la responsabilidad.",0]]}}},
c2:{t:"Caso 2 · Presión por resultados y falta de compromiso (Gestor)",ctx:"Lideras el torneo de cierre de una liga juvenil. El director dice: «Si falla, perdemos el patrocinio». De 6 voluntarios, 2 no responden, 1 llegó tarde y otro «no tiene tiempo para formalidades». Faltan 10 días. ¿Primera acción?",o:[["Asumo yo casi todo el trabajo.","No recomendable: sobrecarga, desvalorizas al equipo y no atiendes la causa.","a"],["Reunión breve: escuchar limitaciones, aclarar el propósito y redistribuir roles.","Más adecuada: comunicación, liderazgo y trabajo en equipo. Escuchar antes de exigir revela las causas.","b"],["Envío mensaje: quien no cumpla será reportado.","Parcial: marcas responsabilidad, pero el tono amenazante daña la confianza.","c"]],n:{
a:{ctx:"A 4 días del torneo trabajas 14 horas y cometes un error en el calendario. Los voluntarios se enteran tarde.",o:[["Sigo solo, ya falta poco.","No: perpetúas el agotamiento.",0],["Reconozco el error, delego tareas concretas y agradezco su disposición.","Sí: reconoces, corriges y delegas.",1],["Culpo a los voluntarios.","No: rompes la confianza.",0]]},
b:{ctx:"Descubres que había falta de claridad y choques con exámenes. Se propone formar equipos pequeños con responsable. El director te pide «controlar todo personalmente».",o:[["Acepto sin explicar al equipo.","No: genera contradicciones.",0],["Explico la estructura al director y propongo informes breves cada dos días.","Sí: transparencia y evidencias sostienen lo que funciona.",1],["Cancelo la estructura por miedo.","No: abandonas una solución eficaz.",0]]},
c:{ctx:"Un voluntario renuncia y el clima se tensa. El director pregunta por qué bajó el equipo.",o:[["Defiendo mi decisión.","No: rigidiza el conflicto.",0],["Reconozco que fui demasiado duro, escucho a los voluntarios y propongo acuerdos claros.","Sí: inteligencia emocional y respeto; rectificar es liderazgo.",1],["Ignoro la renuncia.","No: pierdes talento y confianza.",0]]}}}};
const Q=[["¿Qué describe mejor la excelencia olímpica?",["Ganar siempre","Dar lo mejor de uno y mejorar de forma continua","Ser el mejor del equipo"],1,"Se centra en el proceso y la superación personal."],["Aceptar una decisión arbitral desfavorable y saludar al rival expresa…",["Excelencia","Respeto","Competitividad"],1,"Aceptar decisiones y reconocer al rival es respeto."],["La amistad en el deporte se manifiesta cuando…",["Solo se juega con quien se tiene afinidad","Se crean vínculos de cooperación más allá de las diferencias","Se evita competir con amigos"],1,"Trasciende diferencias e impulsa la inclusión."],["Inteligencia emocional aplicada al deporte es…",["No sentir emociones","Reconocer y regular emociones propias y comprender las ajenas","Ocultar la frustración"],1,"Identificar, comprender y gestionar emociones."],["Mejor retroalimentación tras un tiro fallado:",["«Siempre fallas en lo importante»","«Perdiste la posición, eso costó el punto. ¿Cómo lo trabajamos?»","Ignorar el error"],1,"Hecho → Impacto → Propuesta."],["Valor + habilidad coherentes ante un conflicto entre deportistas:",["Respeto + comunicación asertiva con mediación","Liderazgo + decidir sin escuchar","Amistad + evitar el tema"],0,"Respetar a ambas partes y mediar con diálogo."],["¿Qué sesión integra más intencionalmente el respeto?",["El entrenador habla de respeto al inicio","Árbitro rotativo y puntos por juego limpio","No hay normas, para dar libertad"],1,"Los valores se viven cuando están en las reglas de la actividad."],["¿Por qué desarrollar habilidades blandas además de las técnicas?",["Porque las reemplazan","Porque permiten aplicar lo técnico de forma ética, humana y eficaz","Solo sirven con niños"],1,"Convierten el conocimiento técnico en buena práctica con personas."],["¿Cómo se aplica la excelencia olímpica en la preparación física del gimnasio?",["Subiendo el peso en cada sesión a toda costa","Priorizando la técnica pulcra y la calidad del movimiento antes de subir el peso","Terminando la rutina lo más rápido posible"],1,"La excelencia está en la calidad biomecánica, no solo en la carga."],["Dos deportistas disputan la misma máquina. ¿Qué habilidad lidera el practicante?",["Autoridad impuesta sin explicación","Comunicación asertiva y resolución de problemas, organizando trabajo alternado","Ignorar el conflicto"],1,"Dialogar y proponer una solución práctica mantiene el respeto y el flujo de la sesión."]];

TwtmTMAAAAASUVORK5CYII=" alt="UdeC" style="height:64px"><div><b>Universidad de Cundinamarca</b><br><i>Ex umbra in solem</i> · Ciencias del Deporte</div></div></div><div class="card tip"><b>El gimnasio del CAD como laboratorio de carácter</b><p>En la sala de pesas el rendimiento no depende solo de los kilos levantados: la disciplina, la constancia y el respeto técnico se vuelven hábitos de vida. El preparador físico moderno pasa de prescribir series y descansos a facilitar el desarrollo humano integral; las cargas máximas y la fatiga son escenarios para cultivar resiliencia y autocontrol.</p></div><div class="motto"><img class="tor" src="${IMG.t}" alt="Antorcha olímpica"><div class="torch">🔥</div><b>CITIUS · ALTIUS · FORTIUS</b><i>Más rápido · Más alto · Más fuerte</i><b>— COMMUNITER —</b><i>«Juntos»: la palabra que el Comité Olímpico Internacional añadió al lema en 2021</i></div><h3>🎬 Video 1 · Espíritu olímpico</h3>${vid("1IdPOh84Scs","Espíritu olímpico: los momentos que lo demuestran","Mientras lo ves: anota una frase que te impacte, el valor más visible (excelencia, respeto o amistad) y un momento propio similar.","Canal: Olympic Games · YouTube","🏅")}
<h3>Relación con la vida profesional</h3><div class="card wrap"><table><tr><th>Función</th><th>Valores y habilidades</th></tr><tr><td>Planificar</td><td>Excelencia, respeto por ritmos individuales</td></tr><tr><td>Dirigir y enseñar</td><td>Comunicación, liderazgo, inclusión</td></tr><tr><td>Evaluar</td><td>Honestidad y retroalimentación respetuosa</td></tr><tr><td>Trabajar con otros</td><td>Trabajo en equipo, manejo de conflictos</td></tr><tr><td>Gestionar</td><td>Transparencia y decisiones bajo presión</td></tr></table></div>
<h3>❓ ¿Qué tipo de profesional quiero ser en el gimnasio del CAD?</h3><p>¿Un simple contador de repeticiones o un formador que potencia el rendimiento y los valores a través de la fuerza?</p><p>Elige hasta 3 palabras:</p><div>${["inspirador","ético","exigente","cercano","innovador","justo","empático","líder","formador","resiliente","colaborador","inclusivo"].map(w=>`<span class="chip" data-w="${w}">${w}</span>`).join("")}</div>${ta("Quiero ser un profesional del deporte que… porque…")}`,
()=>`<h2>Módulo 2 · Valores olímpicos</h2><p>Son una brújula ética: criterios para decidir cuando hay tensión entre ganar y actuar bien. <b>Toca cada tarjeta.</b></p><div class="grid">
${flip("bl","🥇 Excelencia","Dar lo mejor de uno mismo con esfuerzo y mejora continua. No es ganar: se mide por el progreso y la calidad del proceso. En el CAD: perfeccionar la técnica de un levantamiento o de un salto pliométrico antes de subir la carga externa.","¿En qué puedo mejorar esta semana?")}${flip("gr","🥈 Respeto","Reconocer la dignidad de todos (compañeros, rivales, árbitros, participantes), las reglas y el entorno. Juego limpio y rechazo a la discriminación. En el CAD: respetar los descansos fisiológicos, la ejecución segura, los discos y barras, y a los compañeros en la zona de pesas.","¿A quién no estoy escuchando?")}${flip("ye","🥉 Amistad","Vínculos de cooperación y solidaridad que trascienden diferencias de origen, nivel o resultado. En el CAD: spotters en cargas pesadas, camaradería tras sesiones exigentes y empatía con quien está lesionado.","¿Cómo ayudo a que alguien se sienta parte?")}</div>
<h3>En el entrenamiento y en la competencia</h3><div class="card wrap"><table><tr><th></th><th>Entrenamiento</th><th>Competencia</th></tr><tr><td><b>Excelencia</b></td><td>Técnica pulcra, sin trampas en las repeticiones, registrar cargas</td><td>Transferir la fuerza lograda con fair play y templanza</td></tr><tr><td><b>Respeto</b></td><td>Escuchar, cuidar el material, respetar turnos</td><td>Aceptar al árbitro, rechazar la trampa</td></tr><tr><td><b>Amistad</b></td><td>Cooperar, integrar a quien tiene menos nivel</td><td>Animar al que falla, felicitar al rival</td></tr></table></div>

()=>`<h2>Módulo 6 · Campo multidimensional del deporte</h2><div class="card" style="text-align:center"><img class="art" src="${IMG.r}" alt="Aros olímpicos" style="max-width:260px"><p><b>El deporte une al mundo</b></p></div><h3>🎬 Video 2 · Deporte y sociedad</h3>${vid("O-Jo0mrq1QU","Día Internacional del Deporte para el Desarrollo y la Paz","Pregunta: ¿qué dimensión del deporte aparece más (persona, aula, sociedad, cultura o naturaleza) y qué valor se manifiesta?","COPCV · 2:49 · YouTube","🕊️")}<div class="card pur"><b>Impacto de la preparación física</b><p><b>Persona:</b> autoconfianza, autoimagen y resiliencia.<br><b>Aula:</b> la disciplina del gimnasio se transfiere al estudio.<br><b>Sociedad:</b> estilos de vida saludables y juego limpio.<br><b>Cultura:</b> cultura del esfuerzo, autocuidado y prevención de lesiones.<br><b>Naturaleza:</b> cuidado del entorno y uso consciente de las instalaciones.</p></div><h3>🗺️ ¿Dónde se aplican los valores?</h3><p>¿En qué dimensión impacta mi sesión de fuerza hoy?</p><div class="grid">${flip("bl","Persona","Salud, identidad y bienestar emocional. Excelencia: superación personal. Respeto: cuidado del cuerpo y la mente.","¿Cómo aporto al bienestar integral?")}${flip("gr","Aula","El deporte enseña cooperación, reglas y convivencia. Respeto: normas. Amistad: aprendizaje cooperativo.","¿Qué enseño más allá de lo técnico?")}${flip("ye","Sociedad","Une comunidades, promueve inclusión y paz. Amistad: cohesión. Respeto: no discriminación.","¿A quién dejo fuera sin darme cuenta?")}${flip("pu","Cultura","Expresa tradiciones y juegos propios. Respeto a la diversidad; amistad en el intercambio.","¿Qué juegos de mi comunidad integro?")}${flip("re","Naturaleza","Vínculo con el entorno y la sostenibilidad. Respeto: cuidar espacios. Excelencia: responsabilidad ambiental.","¿Cómo cuido los espacios que uso?")}</div>${ta("Escribe un ejemplo de tu práctica para dos dimensiones.")}`,
